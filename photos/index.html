<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Arshi & Amar | Photo Groups</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <main class="site-shell">
    <header class="hero">
      <p class="eyebrow">Arshi & Amar</p>
      <h1>Wedding photo groups</h1>
      <p class="hero-script">Find your photos</p>
    </header>

    <section class="lookup-section" aria-labelledby="lookup-title">
      <div class="section-heading">
        <p class="eyebrow">Your moments</p>
        <h2 id="lookup-title">Find your photo groups</h2>
      </div>
      <label class="search-field">
        <span class="sr-only">Search guest name</span>
        <input id="personSearch" type="search" autocomplete="off" placeholder="Type your name…" aria-describedby="searchHint">
        <span class="search-icon" aria-hidden="true">⌕</span>
      </label>
      <p id="searchHint" class="search-hint">Search by first or last name.</p>
      <div id="searchResults" class="search-results" aria-live="polite"></div>
    </section>

    <section class="list-section" aria-labelledby="list-title">
      <div class="section-heading">
        <p class="eyebrow">In order</p>
        <h2 id="list-title">All photo groups</h2>
      </div>
      <div id="groupList" class="group-list"></div>
    </section>

    <footer class="footer">With love, Arshi & Amar</footer>
  </main>
  <script src="app.js?v=5"></script>
</body>
</html>
